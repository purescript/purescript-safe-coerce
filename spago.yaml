package:
  name: safe-coerce
  description: Safe zero-cost coercions using the compiler's Coercible class
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 2.0.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-safe-coerce
  dependencies:
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - prelude: ">=6.0.0 <7.0.0"
workspace: {}
